<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<link rel="manifest" href="manifest.webmanifest">
<title>Silverrock</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030c; color: #c8f0ff; overflow: hidden;
               font-family: monospace; touch-action: none; -webkit-user-select: none; user-select: none; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 16px; font-size: 16px; pointer-events: none; }
  #safe { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
          left: env(safe-area-inset-left); right: env(safe-area-inset-right); pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="safe"></div>
<div id="status">Loading Silverrock&hellip;</div>
<script>
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('canvas');
  function hasWebGL2() {
    try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; }
  }
  if (!hasWebGL2()) {
    statusEl.textContent = 'Silverrock needs WebGL 2. Please use a current version of Chrome, Firefox, Safari or Edge.';
    statusEl.setAttribute('data-error', 'webgl2');
  } else {
    var Module = {
      canvas: canvas,
      preRun: [function () {
        /* persistent saves: an IndexedDB-backed folder, synced before the game starts */
        FS.mkdir('/save');
        FS.mount(IDBFS, {}, '/save');
        Module.addRunDependency('syncfs');
        FS.syncfs(true, function () { Module.removeRunDependency('syncfs'); });
      }],
      onRuntimeInitialized: function () {
        statusEl.style.display = 'none';
        window.silverrockReady = true;
        pushSafeArea();
      },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.log(t); }
    };
    function pushSafeArea() {
      if (!Module._sr_web_set_safe_area) return;
      var r = document.getElementById('safe').getBoundingClientRect();
      Module._sr_web_set_safe_area(r.left, window.innerWidth - r.right, r.top, window.innerHeight - r.bottom);
    }
    window.addEventListener('resize', function () { setTimeout(pushSafeArea, 50); });
    /* first tap on a phone: fullscreen and landscape where the browser allows it */
    window.addEventListener('touchstart', function first() {
      window.removeEventListener('touchstart', first);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    }, { passive: true });
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      if (Module._sr_web_context_lost) Module._sr_web_context_lost();
    });
    canvas.addEventListener('webglcontextrestored', function () {
      if (Module._sr_web_context_restored) Module._sr_web_context_restored();
    });
    /* test hook (test builds only) */
    window.silverrockExec = function (cmd) {
      return Module._sr_web_test_exec ? Module.ccall('sr_web_test_exec', 'string', ['string'], [cmd]) : null;
    };
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
